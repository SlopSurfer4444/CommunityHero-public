[package]
name = "communityhero-server"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "communityhero-server"

[dependencies]
axum = "=0.8.8"
chrono = "=0.4.43"
serde_json = "=1.0.149"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "postgres"] }
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["full"] }
tower-http = { version = "=0.6.8", features = ["fs", "compression-gzip"] }
uuid = { version = "=1.20.0", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
